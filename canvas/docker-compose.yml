# Canvas LMS (prebuilt image fra GHCR) + Postgres + Redis, bag Traefik.
# Installeres og opdateres med ../canvas.sh, som kopierer denne mappe til
# <path>/canvas og skriver .env (hemmeligheder, chmod 600, aldrig i git).
#
# Manuelt i <path>/canvas:
#   docker compose up -d --wait postgres redis
#   docker compose --profile setup run --rm setup   # én gang: database + admin
#   docker compose up -d web jobs
#
# Ingen porte på værten: Traefik når web via sit eksterne netværk.
name: canvas

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-canvas: &canvas
  image: ${CANVAS_IMAGE:?sæt CANVAS_IMAGE i .env}
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &canvas-env
    RAILS_ENV: production
    CANVAS_DATABASE_HOST: postgres
    CANVAS_DATABASE_NAME: canvas_production
    CANVAS_DATABASE_USERNAME: canvas
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
    CANVAS_JWT_KEY: ${CANVAS_JWT_KEY:?}
    CANVAS_LTI_JWK: ${CANVAS_LTI_JWK:?}
    CANVAS_LTI_ISS: ${CANVAS_LTI_ISS:-https://canvas.instructure.com}
    CANVAS_DOMAIN: ${CANVAS_DOMAIN:?}
    CANVAS_SSL: ${CANVAS_SSL:-true}
    CANVAS_REDIS_URL: redis://redis
    # nginx/passenger i instructure/ruby-passenger
    APP_DOMAIN: localhost          # passenger_pre_start rammer containeren selv
    PASSENGER_MAX_POOL_SIZE: ${PASSENGER_MAX_POOL_SIZE:-1}   # ~0,7-1 GB pr. proces; 1 er nok til API-demo
    PASSENGER_MIN_INSTANCES: "1"
    PASSENGER_STARTUP_TIMEOUT: "300"
  volumes:
    - ./config/database.yml:/usr/src/app/config/database.yml:ro
    - ./config/security.yml:/usr/src/app/config/security.yml:ro
    - ./config/domain.yml:/usr/src/app/config/domain.yml:ro
    - ./config/redis.yml:/usr/src/app/config/redis.yml:ro
    - ./config/cache_store.yml:/usr/src/app/config/cache_store.yml:ro
    - ./config/delayed_jobs.yml:/usr/src/app/config/delayed_jobs.yml:ro
    - ./config/file_store.yml:/usr/src/app/config/file_store.yml:ro
    - ./config/dynamic_settings.yml:/usr/src/app/config/dynamic_settings.yml:ro
    - ./data/files:/usr/src/app/tmp/files   # ejes af uid 9999 (docker)
    - ./data/log:/usr/src/app/log

services:
  postgres:
    # Canvas' egen dev-postgres er postgres:14 + pgvector; imaget har postgresql-client-14.
    image: pgvector/pgvector:pg14
    restart: unless-stopped
    logging: *logging
    command: >
      postgres
      -c max_locks_per_transaction=640
      -c max_stack_depth=5MB
      -c random_page_cost=1.0
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: canvas_production
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *canvas
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.canvas.rule: Host(`${CANVAS_DOMAIN:?}`)
      traefik.http.routers.canvas.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.canvas.tls: "true"
      traefik.http.routers.canvas.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.canvas.loadbalancer.server.port: "80"

  jobs:
    <<: *canvas
    command: ["bundle", "exec", "script/delayed_job", "run"]

  # Mock af Canvas Data 2 (DAP), som open source-Canvas ikke har. Læser Canvas' database
  # (skrivebeskyttet) og svarer på https://<CANVAS_DOMAIN>/cd2/... Se dap-mock/app.py.
  dap-mock:
    build: ./dap-mock
    image: canvas-dap-mock:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGDATABASE: canvas_production
      PGUSER: canvas
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      CANVAS_DOMAIN: ${CANVAS_DOMAIN:?}
      DAP_PUBLIC_URL: https://${CANVAS_DOMAIN:?}/cd2
      DAP_CLIENT_ID: ${DAP_MOCK_CLIENT_ID:?}
      DAP_CLIENT_SECRET: ${DAP_MOCK_CLIENT_SECRET:?}
      DAP_COURSE_ACCESS: ${DAP_MOCK_COURSE_ACCESS:-true}
      DAP_SYNTHETIC_WEB_LOGS: ${DAP_MOCK_SYNTHETIC_WEB_LOGS:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.canvas-dap.rule: Host(`${CANVAS_DOMAIN:?}`) && PathPrefix(`/cd2/`)
      traefik.http.routers.canvas-dap.priority: "1000"   # før Canvas' egen router på samme domæne
      traefik.http.routers.canvas-dap.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.canvas-dap.tls: "true"
      traefik.http.routers.canvas-dap.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.canvas-dap.middlewares: canvas-dap-strip
      traefik.http.middlewares.canvas-dap-strip.stripprefix.prefixes: /cd2
      traefik.http.services.canvas-dap.loadbalancer.server.port: "8080"

  # Engangsopsætning: opretter skema, standardkonto og admin-bruger.
  setup:
    <<: *canvas
    profiles: ["setup"]
    restart: "no"
    command: ["bin/rails", "db:initial_setup"]
    environment:
      <<: *canvas-env
      CANVAS_LMS_ADMIN_EMAIL: ${CANVAS_ADMIN_EMAIL:?}
      CANVAS_LMS_ADMIN_PASSWORD: ${CANVAS_ADMIN_PASSWORD:?}
      CANVAS_LMS_ACCOUNT_NAME: ${CANVAS_ACCOUNT_NAME:-Canvas test}
      CANVAS_LMS_STATS_COLLECTION: opt_out

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
