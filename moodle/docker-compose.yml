# Moodle til test med oksigenia/moodle (vedligeholdt afløser for bitnami/moodle).
# Variabelnavne og stier følger imagets egen README/compose.yaml (nov. 2026).
# Installeres og opdateres med ../moodle.sh, som kopierer denne mappe til
# <path>/moodle og skriver .env (hemmeligheder, chmod 600, aldrig i git).
#
#   docker compose up -d && docker compose logs -f moodle   # første start: nogle minutter
#
# Ingen porte på værten: Traefik når moodle via sit eksterne netværk.
name: moodle

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: mariadb:11.4          # LTS, som i imagets egen compose
    restart: unless-stopped
    logging: *logging
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:?}
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  moodle:
    # Fast branch-tag: "latest" springer automatisk til næste hovedversion og opgraderer databasen.
    image: oksigenia/moodle:${MOODLE_TAG:-5.3}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.moodle.rule: Host(`${MOODLE_DOMAIN:?}`)
      traefik.http.routers.moodle.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.moodle.tls: "true"
      traefik.http.routers.moodle.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.moodle.loadbalancer.server.port: "8080"
    environment:
      MOODLE_URL: https://${MOODLE_DOMAIN:?}    # https bag proxy slår sslproxy til automatisk
      MOODLE_DB_TYPE: mariadb
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?}
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:?}
      MOODLE_SITE_NAME: Moodle test
      MOODLE_TIMEZONE: Europe/Copenhagen
      APACHE_MAX_REQUEST_WORKERS: "10"          # standard 50; begrænser RAM-spidser
    volumes:
      - ./data/moodle:/var/www/moodle
      - ./data/moodledata:/var/www/moodledata

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
