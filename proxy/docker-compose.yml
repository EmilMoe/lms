# Caddy foran begge LMS'er: automatisk HTTPS (Let's Encrypt), som LTI 1.3 i praksis kræver.
# Kører på værtens netværk og sender videre til 127.0.0.1-portene.
# DNS: A-records for CANVAS_HOST og MOODLE_HOST skal pege på dropletten.
name: proxy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      CANVAS_HOST: ${CANVAS_HOST:?}
      MOODLE_HOST: ${MOODLE_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:?}/caddy/data:/data
      - ${DATA_DIR:?}/caddy/config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
